#
# Build the provider, the fake host and the unit tests on macOS, Ubuntu 22.04 and Windows, run
# every CTest that needs no camera, and check the provider exports exactly one symbol. Windows and
# Linux build the capture stubs (no camera backend yet). One macOS job also converts the models
# from the pinned upstream bundle (proving the pack's sha256s reproduce) and runs the inference
# tests on the file camera. No job opens a camera.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: model pack
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate the pack (schema, pins, licences)
        run: python3 -I scripts/check_pack.py packs/open-tracking-default.models.json

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned archives
        uses: actions/cache@v4
        with:
          path: downloads
          key: ort-${{ runner.os }}-${{ hashFiles('cmake/OnnxRuntime.cmake') }}

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build ${{ runner.os == 'Windows' && '-G Ninja' || '' }} -DCMAKE_BUILD_TYPE=Release
          -DOPENTRACK_WERROR=ON -DOPENTRACK_DOWNLOAD_DIR="${{ github.workspace }}/downloads"

      - name: Build
        run: cmake --build build

      - name: Tests (no camera, no models)
        run: ctest --test-dir build --output-on-failure

      - name: Exactly one export (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & dumpbin /nologo /exports build\DisplayXR-OpenTracking.dll
          $names = $out | Select-String -Pattern '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          Write-Host "exports: $($names -join ', ')"
          if (@($names).Count -ne 1 -or $names -ne 'xrtTrackingPluginNegotiate') {
            Write-Error "expected exactly xrtTrackingPluginNegotiate"
          }
          $deps = & dumpbin /nologo /dependents build\DisplayXR-OpenTracking.dll | Select-String '\.dll' |
            ForEach-Object { $_.Line.Trim() } | Where-Object { $_ -notmatch '^Dump of file' }
          Write-Host "imports: $($deps -join ', ')"
          if ($deps -match 'onnxruntime') { Write-Error "ONNX Runtime must not be imported statically" }

      - name: Exactly one export (Linux)
        if: runner.os == 'Linux'
        run: |
          names=$(nm -D --defined-only build/DisplayXR-OpenTracking.so | awk '$2 == "T" && $3 != "_init" && $3 != "_fini" { print $3 }')
          echo "exports: $names"
          test "$names" = "xrtTrackingPluginNegotiate"
          ! readelf -d build/DisplayXR-OpenTracking.so | grep -q onnxruntime

      - name: Exactly one export (macOS)
        if: runner.os == 'macOS'
        run: |
          names=$(nm -gU build/DisplayXR-OpenTracking.dylib | awk '$2 == "T" { print $3 }')
          echo "exports: $names"
          test "$names" = "_xrtTrackingPluginNegotiate"
          ! otool -L build/DisplayXR-OpenTracking.dylib | grep -q onnxruntime

      - name: Install tree
        run: cmake --install build --prefix dist

      - uses: actions/upload-artifact@v4
        with:
          name: open-tracking-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  inference:
    name: models + inference (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned archives and the upstream bundle
        uses: actions/cache@v4
        with:
          path: |
            downloads
            models-cache/.cache
          key: inference-${{ hashFiles('cmake/OnnxRuntime.cmake', 'packs/*.json') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Converter environment (pinned)
        run: python -m pip install -r scripts/requirements-convert.txt

      - name: Convert the models and check them against the pack (bit-identical)
        run: python -s -P scripts/fetch_models.py packs/open-tracking-default.models.json models-cache --test-images models-cache/images

      - name: Configure + build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENTRACK_WERROR=ON \
            -DOPENTRACK_DOWNLOAD_DIR="${{ github.workspace }}/downloads" \
            -DOPENTRACK_TEST_MODELS_DIR="${{ github.workspace }}/models-cache"
          cmake --build build

      - name: Tests (file camera, blank frame + face photo, CPU and Core ML)
        run: ctest --test-dir build --output-on-failure

      - name: Pack blobs match
        run: python3 -I scripts/check_pack.py packs/open-tracking-default.models.json --verify-dir models-cache

  reproduce-linux:
    name: model conversion reproduces on Linux (informational)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-convert.txt
      - run: python -s -P scripts/fetch_models.py packs/open-tracking-default.models.json models-cache
